appId: com.spun.app
productName: Spun
# We rebuild better-sqlite3 for Electron (electron:rebuild) and let `next build`
# trace it into .next/standalone before packaging, so electron-builder must NOT
# run its own native rebuild — doing so creates a dangling hashed symlink under
# the bundled standalone that breaks code signing.
npmRebuild: false
# Only the Electron glue lives in the asar; the Next server, recognizer, and
# ffmpeg ride along as unpacked extraResources (native bins can't run from asar).
files:
  - electron/**
  - package.json
extraResources:
  # filter ["**/*"] is required, else electron-builder's default filter drops
  # node_modules from the copy — leaving the standalone server without its deps
  # (and a dangling better-sqlite3 symlink under .next/ that breaks signing).
  - from: .next/standalone
    to: app
    filter: ["**/*"]
  - from: .next/static
    to: app/.next/static
    filter: ["**/*"]
  - from: public
    to: app/public
  - from: dist-recognizer
    to: recognizer
    filter: ["**/*"]
  - from: dist-ffmpeg
    to: ffmpeg
    filter: ["**/*"]
mac:
  category: public.app-category.music
  icon: build/icon.icns
  # dmg = manual download; zip = what electron-updater downloads for auto-update.
  # The release workflow narrows this per arch (arm64 → dmg+zip, x64 → dmg only),
  # so the arm64 latest-mac.yml isn't clobbered by the x64 job.
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
win:
  target: [nsis]
publish:
  provider: github
  owner: etaiso
  repo: shazam-radio
afterPack: electron/afterPack.js
afterSign: electron/notarize.js

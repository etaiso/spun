<svg xmlns="http://www.w3.org/2000/svg" width="150" height="56" viewBox="0 0 150 56" fill="none" role="img" aria-label="Spun">
  <defs>
    <linearGradient id="spunIcon" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="spunWord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <!-- App icon: concentric pulse rings (scaled 2x from the in-app 24px logo) -->
  <g transform="translate(4 4)">
    <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#spunIcon)"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <circle cx="24" cy="24" r="16" stroke-width="2" stroke-opacity="0.4"/>
      <circle cx="24" cy="24" r="10" stroke-width="2.6" stroke-opacity="0.8"/>
    </g>
    <circle cx="24" cy="24" r="4.4" fill="#ffffff"/>
  </g>
  <!-- "spun" wordmark, matching the in-app header -->
  <text x="64" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.8" fill="url(#spunWord)">spun</text>
</svg>

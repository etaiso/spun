# Release pipeline — builds per-OS/arch installers and publishes them to a
# GitHub Release. Triggered by pushing a version tag (e.g. `v0.2.0`).
#
# Why a build matrix: the app bundles two NATIVE, per-platform pieces — the
# PyInstaller-frozen recognizer and an ffmpeg binary — and PyInstaller can't
# cross-compile. So each artifact is built on a matching runner:
#   • macos-14      → Apple Silicon (arm64)  — dmg + zip (auto-update)
#   • windows-latest→ Windows (x64)          — nsis (auto-update)
# (macOS Intel is omitted for now — see the matrix note below.)
#
# electron-builder uploads each runner's installers — plus the auto-update
# metadata electron-updater reads (latest-mac.yml / latest.yml) — to a single
# DRAFT GitHub Release named after the tag. Review it on GitHub, then Publish.
#
# Builds are UNSIGNED by default: macOS Gatekeeper / Windows SmartScreen warn on
# first open. The Package step already passes the macOS signing/notarization env
# (scoped to the mac job) — it's empty until the repo secrets are set, at which
# point mac builds are signed + notarized automatically. See docs/DESKTOP.md.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # allow manual runs (publishes to the v<version> draft)

permissions:
  contents: write          # electron-builder needs this to create/upload releases

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            platform: mac
            build_cmd: npx electron-builder --mac dmg zip --arm64 --publish always
          # macOS Intel (macos-13) is intentionally omitted: GitHub is retiring
          # that image and its runners queue indefinitely. Apple-Silicon + Windows
          # cover the target users; add Intel back via a macos-13 or Rosetta job
          # when capacity allows. See docs/DESKTOP.md.
          - os: windows-latest
            label: Windows
            platform: win
            build_cmd: npx electron-builder --win nsis --x64 --publish always

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # 22, not 20: @electron/notarize, @electron/rebuild and node-abi all
          # require Node >=22.12, and the mismatch destabilizes npm's lifecycle
          # scripts (ffmpeg-static's postinstall download got silently skipped).
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Pin the public npm registry for CI installs.
      - name: Use the public npm registry
        run: npm config set registry https://registry.npmjs.org/

      # A current npm is more robust than Node 22's bundled version against
      # transient registry/lifecycle hiccups. Cheap insurance.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install npm dependencies
        run: npm ci

      - name: Freeze recognizer (PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r recognizer/requirements.txt
          ( cd recognizer && pyinstaller recognizer.spec --distpath ../dist-recognizer --workpath "${RUNNER_TEMP}/pyi" -y )
          # macOS emits BOTH a COLLECT folder and the dock-less .app — keep the .app.
          if [ "${{ matrix.platform }}" = "mac" ] && [ -d dist-recognizer/recognizer.app ]; then
            rm -rf dist-recognizer/recognizer
          fi

      - name: Bundle ffmpeg
        shell: bash
        run: |
          npm install --no-save ffmpeg-static
          FF="$(node -p "require('ffmpeg-static')")"
          # ffmpeg-static fetches its binary in a postinstall; if that didn't
          # run (CI npm-lifecycle quirks), trigger the download explicitly and
          # then verify, so we never silently package a missing binary.
          if [ ! -s "$FF" ]; then
            echo "ffmpeg not present at $FF — running ffmpeg-static installer"
            node node_modules/ffmpeg-static/install.js
          fi
          test -s "$FF" || { echo "::error::ffmpeg-static binary still missing at $FF"; exit 1; }
          mkdir -p dist-ffmpeg
          if [ "${{ matrix.platform }}" = "win" ]; then
            cp "$FF" dist-ffmpeg/ffmpeg.exe
          else
            cp "$FF" dist-ffmpeg/ffmpeg && chmod +x dist-ffmpeg/ffmpeg
          fi

      - name: Rebuild native modules for Electron
        run: npm run electron:rebuild

      - name: Build Next.js standalone server
        run: npm run build

      # macOS Developer ID signing + notarization. Export the secrets to the job
      # env ONLY when they actually have values — an EMPTY CSC_LINK is NOT a
      # no-op: electron-builder treats a defined-but-empty CSC_LINK as a cert
      # FILE PATH, resolves "" to the workspace dir, and fails ("… not a file").
      # Leaving them UNSET (the default, as on every pre-0.1.10 release) makes
      # electron-builder ad-hoc-sign → unsigned. Once the repo secrets are set,
      # this step exports them and the mac build is signed + notarized with no
      # further changes. mac-only, so Windows never picks up the cert via
      # CSC_LINK. See docs/DESKTOP.md → "Turning on macOS signing".
      - name: Configure macOS signing
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No signing cert configured — building unsigned (ad-hoc)."
            exit 0
          fi
          echo "Signing cert present — enabling signing + notarization."
          {
            echo "CSC_LINK=$CSC_LINK"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Package + publish
        shell: bash
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

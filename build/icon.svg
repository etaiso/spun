<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Spun app icon: concentric "pulse / broadcast" rings on a vivid
       indigo→fuchsia gradient. Echoes the in-app pulse-ring visualizer. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="512" r="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square plate (macOS ~22.37% corner radius). -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Concentric pulse rings, centered, fading outward. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="512" cy="512" r="410" stroke-width="24" stroke-opacity="0.22"/>
    <circle cx="512" cy="512" r="300" stroke-width="28" stroke-opacity="0.45"/>
    <circle cx="512" cy="512" r="195" stroke-width="32" stroke-opacity="0.78"/>
  </g>

  <!-- Center hub. -->
  <circle cx="512" cy="512" r="78" fill="#ffffff"/>
</svg>
